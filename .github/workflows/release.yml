name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Fetch ONNX model
        run: uv run python scripts/fetch_model.py
      - name: Run tests
        run: uv run pytest tests/ -x -q --tb=short

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Fetch ONNX model
        run: python3 scripts/fetch_model.py
      - name: Build package
        run: uv build
      - name: Verify wheel contents
        run: |
          whl=$(ls dist/*.whl)
          echo "Wheel: $whl"
          echo "Size: $(du -h "$whl" | cut -f1)"
          # Verify ONNX model is included and not truncated
          size=$(python3 -c "import zipfile; z=zipfile.ZipFile('$whl'); print(z.getinfo('cloneguard/model/mini_semantic.onnx').file_size)")
          echo "ONNX model size in wheel: $size bytes"
          if [ "$size" -lt 1000000 ]; then
            echo "FAIL: ONNX model missing or truncated in wheel"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          whl=$(ls dist/*.whl)
          sdist=$(ls dist/*.tar.gz)
          gh release create "$TAG_NAME" \
            --title "CloneGuard $TAG_NAME" \
            --generate-notes \
            "$whl" "$sdist"
