[project]
name = "cloneguard"
version = "0.2.1"
description = "Raises the cost of prompt injection attacks against AI coding agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "prodnull" }]
keywords = ["prompt-injection", "ai-security", "llm", "coding-agent", "defense"]
dependencies = ["pyyaml>=6.0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/prodnull/cloneguard"
Repository = "https://github.com/prodnull/cloneguard"
Documentation = "https://github.com/prodnull/cloneguard/blob/main/docs/USAGE.md"
Issues = "https://github.com/prodnull/cloneguard/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=6.0", "ruff>=0.8", "mypy>=1.13", "types-PyYAML>=6.0"]
mini = ["onnxruntime>=1.17", "transformers>=4.36", "numpy>=1.26"]
semantic = ["ollama>=0.4"]
all = ["onnxruntime>=1.17", "transformers>=4.36", "numpy>=1.26", "ollama>=0.4"]

[project.scripts]
cloneguard = "cloneguard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloneguard"]

[tool.hatch.build]
artifacts = ["src/cloneguard/model/mini_semantic.onnx"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
