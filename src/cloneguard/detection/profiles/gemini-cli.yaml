version: '1'
agent_type: gemini-cli
description: Calibrated fusion weights for gemini-cli -- calibrated on benchmark dataset
  (2026-04-06)
weights:
  pattern_base: 0.25
  semantic_base: 0.5
  sequence_base: 0.25
thresholds:
  detected: 0.55
  suspicious: 0.35
mode_multipliers:
  strict:
    pattern: 1.0
    semantic: 1.1
    sequence: 0.8
  standard:
    pattern: 1.0
    semantic: 1.0
    sequence: 1.0
  lenient:
    pattern: 0.5
    semantic: 0.5
    sequence: 1.2
melon:
  enabled: true
  ambiguous_low: 0.4
  ambiguous_high: 0.6
  similarity_threshold: 0.8
  circuit_breaker_window: 20
  circuit_breaker_rate: 0.15
