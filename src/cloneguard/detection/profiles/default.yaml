version: "1"
agent_type: "default"
description: "Default fusion weights -- uncalibrated baseline"
weights:
  pattern_base: 0.40
  semantic_base: 0.40
  sequence_base: 0.20
mode_multipliers:
  strict:
    pattern: 1.2
    semantic: 1.3
    sequence: 0.8
  standard:
    pattern: 1.0
    semantic: 1.0
    sequence: 1.0
  lenient:
    pattern: 0.7
    semantic: 0.7
    sequence: 1.2
melon:
  enabled: true
  ambiguous_low: 0.4
  ambiguous_high: 0.6
  similarity_threshold: 0.8
  circuit_breaker_window: 20
  circuit_breaker_rate: 0.15
