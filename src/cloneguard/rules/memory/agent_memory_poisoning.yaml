category: agentMemoryPoisoning
description: "Patterns detecting agent memory file poisoning for cross-session persistence"
patterns:
  - id: MP-003
    regex: '(?i)(?:update|modify|edit|append|overwrite)\b.{0,40}\b(?:MEMORY\.md|SOUL\.md|\.claude/memory|\.cursor/memory|memory\.json)'
    severity: critical
    description: "Instruction to modify agent memory files for persistent manipulation"
    evidence: "Extension of MP-001: covers update/modify verbs and additional memory file locations"

  - id: MP-004
    regex: '(?i)(?:conversation|chat)\s*(?:history|log|transcript).{0,30}(?:inject|append|prepend|insert)'
    severity: high
    description: "Conversation history injection for context poisoning"
    evidence: "Targets conversation history files used by multi-turn agents"

  - id: MP-005
    regex: '(?i)(?:\.claude/projects|\.cursor/projects|\.windsurf/projects).{0,40}(?:write|save|create|modify)'
    severity: high
    description: "Agent project-level memory file manipulation"
    evidence: "Agent-specific project memory directories targeted for persistence"

  - id: MP-006
    regex: '(?i)(?:add|insert|write)\s+(?:this|the\s+following|these)\s+(?:to|into|in)\s+(?:your|the)\s+(?:memory|instructions|rules|guidelines)'
    severity: critical
    description: "Direct instruction to inject content into agent memory or rules"
    evidence: "Generic instruction-to-memory injection pattern across agent types"
