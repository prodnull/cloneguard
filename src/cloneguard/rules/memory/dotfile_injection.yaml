category: dotfileInjection
description: "Patterns detecting dotfile injection for environment persistence"
patterns:
  - id: DF-001
    regex: '(?i)(?:echo|printf|cat|tee|>>)\s*.{0,20}(?:\.bashrc|\.zshrc|\.bash_profile|\.zprofile|\.profile)'
    severity: critical
    description: "Shell configuration file injection via command"
    evidence: "Dotfile modification persists across all shell sessions"

  - id: DF-002
    regex: '(?i)(?:write|append|modify|edit)\b.{0,30}(?:\.bashrc|\.zshrc|\.bash_profile|\.zprofile|\.profile|\.zshenv)'
    severity: critical
    description: "Instruction to modify shell configuration files"
    evidence: "Shell config modification enables persistent backdoors"

  - id: DF-003
    regex: '(?i)(?:echo|printf|cat|tee|>>)\s*.{0,20}(?:\.gitconfig|\.ssh/config|\.ssh/authorized_keys|\.npmrc|\.pypirc)'
    severity: critical
    description: "Git/SSH/package manager config injection"
    evidence: "Targets credential and identity configuration files"

  - id: DF-004
    regex: '(?i)(?:write|create|modify)\b.{0,30}(?:\.env(?:\.local)?|\.env\.production|\.env\.development)\b'
    severity: high
    description: "Environment file creation or modification"
    evidence: "Environment files often contain secrets and configuration"
    modes: [strict, standard]
