category: credentialHarvesting
description: "Patterns detecting targeted access to credential stores and sensitive configuration files"
patterns:
  - id: CH-001
    regex: '(?i)(?:cat|read|open|type|get-content|less|more|head|tail)\s+.{0,30}(?:\.npmrc|\.pypirc|\.gem/credentials|\.cargo/credentials)'
    severity: critical
    description: "Reading package manager credential files"
    false_positive_hint: "May appear in credential rotation documentation"

  - id: CH-002
    regex: '(?i)(?:cat|read|open|type)\s+.{0,30}(?:\.docker/config\.json|\.kube/config|\.config/gh/hosts\.yml|\.config/gcloud/credentials)'
    severity: critical
    description: "Reading cloud/container credential configuration files"
    false_positive_hint: "May appear in setup or troubleshooting guides"

  - id: CH-003
    regex: '(?i)\bsecurity\s+find-(?:generic|internet)-password\b'
    severity: critical
    description: "macOS Keychain credential extraction via security CLI"
    false_positive_hint: "Legitimate in credential helper scripts but suspicious in repo files"

  - id: CH-004
    regex: '(?i)(?:\.(?:mozilla|config/google-chrome|config/chromium)/|(?:Login\s+Data|Cookies|Local\s+State|Web\s+Data))'
    severity: critical
    description: "Browser profile/credential file access — credential theft"
    false_positive_hint: "May appear in browser extension development docs"

  - id: CH-005
    regex: '(?i)(?:cmdkey\s+/list|vaultcmd\s+/list|rundll32\.exe\s+keymgr\.dll)'
    severity: critical
    description: "Windows Credential Manager enumeration"
    false_positive_hint: "May appear in Windows administration scripts"

  # Natural language references to sensitive file paths (not just CLI commands)
  - id: CH-006
    regex: '(?i)(?:~/|home/)\.ssh/(?:id_(?:rsa|ed25519|ecdsa)|authorized_keys|config)'
    severity: high
    description: "Reference to SSH private key or config file path"
    false_positive_hint: "May appear in SSH setup documentation — check if inside HTML comment or hidden block"

  - id: CH-007
    regex: '(?i)(?:~/|home/)\.aws/credentials'
    severity: high
    description: "Reference to AWS credentials file path"
    false_positive_hint: "May appear in AWS setup documentation — check surrounding context"

  - id: CH-008
    regex: '(?i)(?:~/|home/)\.(?:netrc|gnupg/|config/gh/hosts)'
    severity: high
    description: "Reference to authentication token file path (.netrc, GPG, GitHub CLI)"
    false_positive_hint: "May appear in tooling setup guides"

  - id: CH-009
    regex: '(?i)(?:read|access|output|include|display|show|print|return|send|exfiltrate|extract|collect|harvest).{0,60}(?:ssh.{0,10}(?:key|private|id_rsa|id_ed25519)|aws.{0,10}credential|api.{0,10}(?:key|token|secret)|\.netrc|private.{0,10}key)'
    severity: critical
    description: "Instruction to read/output/send sensitive credentials"
    false_positive_hint: "May appear in credential management documentation — verify intent"
