category: unicodeAnomalies
description: "Patterns detecting suspicious Unicode characters used for obfuscation"
patterns:
  - id: UA-001
    regex: '\u200b'
    severity: high
    description: "Zero-width space (U+200B)"
    false_positive_hint: "Occasionally used in web content for word-break hints"

  - id: UA-002
    regex: '\u200c'
    severity: medium
    description: "Zero-width non-joiner (U+200C)"
    false_positive_hint: "Legitimate in Persian/Arabic text for typography"

  - id: UA-003
    regex: '\u200d'
    severity: medium
    description: "Zero-width joiner (U+200D)"
    false_positive_hint: "Used in emoji sequences and Indic scripts"

  - id: UA-004
    regex: '(?<!\A)\ufeff'
    severity: high
    description: "BOM (U+FEFF) not at start of file"
    false_positive_hint: "Stray BOM from file concatenation"

  - id: UA-005
    regex: '\u202e'
    severity: critical
    description: "Right-to-left override (U+202E)"
    false_positive_hint: "Legitimate in RTL language text, but suspicious in code"

  - id: UA-006
    regex: '[\U000e0001-\U000e007f]'
    severity: critical
    description: "Tag characters (U+E0001-U+E007F)"
    false_positive_hint: "Almost never legitimate in modern text"

  - id: UA-007
    regex: '\u2028|\u2029'
    severity: medium
    description: "Invisible line/paragraph separator"
    false_positive_hint: "Sometimes generated by word processors"

  - id: UA-008
    regex: '\u180e'
    severity: medium
    description: "Mongolian vowel separator"
    false_positive_hint: "Only legitimate in Mongolian script"

  - id: UA-009
    regex: '\u2060'
    severity: medium
    description: "Word joiner (U+2060)"
    false_positive_hint: "Used in typography to prevent line breaks"

  - id: UA-010
    regex: '[\u202a-\u202d]|[\u2066-\u2069]|\u200f|\u200e'
    severity: high
    description: "Bidirectional control characters"
    false_positive_hint: "Legitimate in mixed RTL/LTR text"

  - id: UA-011
    regex: '\u00ad'
    severity: high
    description: "Soft hyphen (U+00AD) — used to split keywords across subword boundaries"
    false_positive_hint: "Occasionally in hyphenation-aware text, but suspicious in code/config"

  - id: UA-012
    regex: '[\u0300-\u036f]{2,}'
    severity: high
    description: "Multiple combining diacritical marks — used to obfuscate keywords"
    false_positive_hint: "Legitimate in Vietnamese and other heavily-accented scripts"
